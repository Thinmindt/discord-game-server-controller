[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = ["test/", "tests/", "cli_test.py", "test_buffer_fix.py", "debug_command_test.py"]

[[tool.mypy.overrides]]
module = ["discord.*", "psutil.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["test", "."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
